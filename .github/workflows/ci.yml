name: Toolkit checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The repository is public, so GitHub-hosted runners are free and no
  # self-hosted machine runs code from pull requests.
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm run validate
      - run: node --test
      - run: npm run validate:release
  macos-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm run validate
      - run: node --test
      - name: Real manifest install in an isolated home
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          task_home=$(mktemp -d "${RUNNER_TEMP}/praxity-toolkit.XXXXXX")
          trap 'rm -rf -- "$task_home"' EXIT
          manifest="file://$PWD/pack.json"
          tag=$(node -p '"v" + require("./pack.json").version')
          # Draft release URLs need authentication until publication. Keep the
          # canonical pins intact and install an independently checked local copy.
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            mkdir "$task_home/assets"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$task_home/assets" --pattern '*.tar.gz'
            TASK_HOME="$task_home" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const pack = JSON.parse(readFileSync('pack.json', 'utf8'));
          const prefix = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${pack.version}/`;
          for (const tool of pack.tools) for (const archive of Object.values(tool.archives)) {
            if (archive.status !== 'published') continue;
            assert.ok(archive.url.startsWith(prefix), tool.id);
            const name = archive.url.slice(prefix.length);
            assert.match(name, /^[A-Za-z0-9._-]+\.tar\.gz$/);
            const path = `${process.env.TASK_HOME}/assets/${name}`;
            assert.equal(createHash('sha256').update(readFileSync(path)).digest('hex'), archive.sha256, name);
            archive.url = pathToFileURL(path).href;
          }
          writeFileSync(`${process.env.TASK_HOME}/pack-local.json`, JSON.stringify(pack) + '\n');
          NODE
            manifest="file://$task_home/pack-local.json"
          fi
          unset GH_TOKEN
          export HOME="$task_home"
          sh install.sh --manifest "$manifest"
          "$HOME/.praxity/bin/praxity" version
          "$HOME/.praxity/bin/praxity" doctor --json
          node -e 'const state = require(process.env.HOME + "/.praxity/toolkit/" + require("./pack.json").version + "/state.json"); require("node:assert/strict").equal(state.platform, process.argv[1])' '${{ matrix.platform }}'
          sh install.sh --manifest "$manifest"
          sh install.sh uninstall
