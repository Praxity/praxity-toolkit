name: Toolkit checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The repository is public, so GitHub-hosted runners are free and no
  # self-hosted machine runs code from pull requests.
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm run validate
      - run: node --test
      - run: npm run validate:release
  macos-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm run validate
      - run: node --test
      - name: Real manifest install in an isolated home
        shell: bash
        run: |
          set -euo pipefail
          task_home=$(mktemp -d "${RUNNER_TEMP}/praxity-toolkit.XXXXXX")
          trap 'rm -rf -- "$task_home"' EXIT
          export HOME="$task_home"
          sh install.sh
          "$HOME/.praxity/bin/praxity" version
          "$HOME/.praxity/bin/praxity" doctor --json
          node -e 'const state = require(process.env.HOME + "/.praxity/toolkit/" + require("./pack.json").version + "/state.json"); require("node:assert/strict").equal(state.platform, process.argv[1])' '${{ matrix.platform }}'
          sh install.sh
          sh install.sh uninstall
