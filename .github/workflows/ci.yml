name: Toolkit checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stage_release_assets:
        description: Download draft assets for this reviewed commit before PR checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  stage-release-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.stage_release_assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GitHub hides drafts from tokens without push access. Keep that permission
    # in a manually dispatched download job, away from tests and installed tools.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(node -p '"v" + require("./pack.json").version')
          mkdir "$RUNNER_TEMP/release-assets"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-assets" --pattern '*.tar.gz'
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  # The repository is public, so GitHub-hosted runners are free and no
  # self-hosted machine runs code from pull requests.
  offline:
    if: github.event_name != 'workflow_dispatch' || !inputs.stage_release_assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm run validate
      - run: node --test
      - run: npm run validate:release
  macos-install:
    if: github.event_name != 'workflow_dispatch' || !inputs.stage_release_assets
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm run validate
      - run: node --test
      - name: Real manifest install in an isolated home
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          task_home=$(mktemp -d "${RUNNER_TEMP}/praxity-toolkit.XXXXXX")
          trap 'rm -rf -- "$task_home"' EXIT
          manifest="file://$PWD/pack.json"
          tag=$(node -p '"v" + require("./pack.json").version')
          # A read-only PR token cannot see drafts. If the tag is unpublished,
          # consume the manual staging run for this exact commit, then check pins.
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          published=$(printf '%s' "$releases" | jq --arg tag "$tag" '[.[] | select(.tag_name == $tag and .draft == false)] | length')
          if [ "$published" = 0 ]; then
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=workflow_dispatch&head_sha=$RELEASE_REVISION&status=success&per_page=100")
            stage_run=$(printf '%s' "$runs" | jq -r --arg sha "$RELEASE_REVISION" '[.workflow_runs[] | select(.head_sha == $sha)] | first | .id // empty')
            [ -n "$stage_run" ] || { echo "Stage draft assets for commit $RELEASE_REVISION with workflow_dispatch first" >&2; exit 1; }
            mkdir "$task_home/assets"
            gh run download "$stage_run" --repo "$GITHUB_REPOSITORY" --name release-assets --dir "$task_home/assets"
            TASK_HOME="$task_home" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const pack = JSON.parse(readFileSync('pack.json', 'utf8'));
          const prefix = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${pack.version}/`;
          for (const tool of pack.tools) for (const archive of Object.values(tool.archives)) {
            if (archive.status !== 'published') continue;
            assert.ok(archive.url.startsWith(prefix), tool.id);
            const name = archive.url.slice(prefix.length);
            assert.match(name, /^[A-Za-z0-9._-]+\.tar\.gz$/);
            const path = `${process.env.TASK_HOME}/assets/${name}`;
            assert.equal(createHash('sha256').update(readFileSync(path)).digest('hex'), archive.sha256, name);
            archive.url = pathToFileURL(path).href;
          }
          writeFileSync(`${process.env.TASK_HOME}/pack-local.json`, JSON.stringify(pack) + '\n');
          NODE
            manifest="file://$task_home/pack-local.json"
          fi
          unset GH_TOKEN
          export HOME="$task_home"
          sh install.sh --manifest "$manifest"
          "$HOME/.praxity/bin/praxity" version
          "$HOME/.praxity/bin/praxity" doctor --json
          node -e 'const state = require(process.env.HOME + "/.praxity/toolkit/" + require("./pack.json").version + "/state.json"); require("node:assert/strict").equal(state.platform, process.argv[1])' '${{ matrix.platform }}'
          sh install.sh --manifest "$manifest"
          sh install.sh uninstall
